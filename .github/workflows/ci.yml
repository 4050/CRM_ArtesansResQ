name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Public, client-safe values (see README's "Environment variables"
      # section) - the build never makes real network calls to Supabase,
      # every route here is dynamic, so a placeholder project is enough.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check schema.sql / migrations are in sync
        run: npm run check:schema

  pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Official PGDG install method (postgresql.org/download/linux/ubuntu)
      # - pulls in a Postgres 16 + pgTAP combo newer than what Ubuntu's own
      # archive ships, matching what a real Supabase project runs on.
      - name: Install PostgreSQL 16 and pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-pgtap
          sudo service postgresql start

      - name: Apply schema and fixtures
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -f supabase/tests/00_auth_shim.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -f supabase/tests/01_fixtures.sql

      # pg_prove (not plain psql) is what makes a failing assertion actually
      # fail this job: pgTAP's ok()/is()/etc. report "not ok" as plain SELECT
      # result rows, not SQL errors - `psql -v ON_ERROR_STOP=1` has nothing to
      # stop on and exits 0 either way. pg_prove parses the TAP output itself
      # and exits non-zero on any failed test.
      - name: Install pg_prove
        run: sudo apt-get install -y libtap-parser-sourcehandler-pgtap-perl

      - name: Run pgTAP tests
        run: sudo -u postgres pg_prove -U postgres -d postgres --verbose supabase/tests/*.test.sql
